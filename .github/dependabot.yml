# SEC-060：相依套件每週檢查 / Weekly dependency updates.
version: 2
updates:
  - package-ecosystem: npm
    directory: /infra/app
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Taipei
    open-pull-requests-limit: 5
    ignore:
      # @types/node 要對應執行環境的 Node 主版本（24），只接受 minor／patch。
      # Keep @types/node on the runtime's major version (24); minor/patch only.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      aws-cdk:
        patterns: ["aws-cdk", "aws-cdk-lib", "constructs", "cdk-nag"]
      dev-tooling:
        dependency-type: development
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Taipei
    groups:
      actions:
        patterns: ["*"]
