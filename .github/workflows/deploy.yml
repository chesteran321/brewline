# 合併到 main 後：自動部署 Dev → 等待人工核准 → 部署 Prod。
# After merge to main: deploy Dev automatically → wait for manual approval → deploy Prod.
#
# 重點 / Key point：OIDC token 的 sub 依 job 而不同。
#   deploy-dev  沒有 environment   → sub = repo:chesteran321@219534971/brewline@1451431799:ref:refs/heads/main  → gha-deploy-dev
#   deploy-prod environment=production → sub = repo:chesteran321@219534971/brewline@1451431799:environment:production → gha-deploy-prod
# 所以 deploy-dev 絕對不能加 environment，否則信任政策對不上。
# deploy-dev must NOT declare an environment, or its sub claim will not match the Dev trust policy.
name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  AWS_REGION: ap-east-2
  CDK_DISABLE_VERSION_CHECK: "1"

jobs:
  deploy-dev:
    name: Deploy Dev
    runs-on: ubuntu-latest
    # 部署＋等 GSI ACTIVE（新增 GSI 實測約 8 分鐘，驗證最多等 20 分鐘）/ deploy + GSI backfill wait
    timeout-minutes: 40
    # 每個環境各自一把鎖：Prod 等待核准時，不會擋住後續的 Dev 部署。
    # 不取消進行中的部署，避免 CloudFormation 半途中斷。
    # One lock per environment: a Prod job waiting for approval no longer blocks Dev.
    # Never cancel an in-flight deploy mid-CloudFormation.
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash # 明確指定 → GitHub 會加上 -eo pipefail / explicit bash adds -eo pipefail
        working-directory: infra/app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            infra/app/package-lock.json
            services/package-lock.json

      # cdk deploy 會用 esbuild 打包 services/ 的 Lambda / cdk deploy bundles the Lambdas in services/.
      - name: Install (services)
        working-directory: services
        run: npm ci

      - run: npm ci
      - run: npm test
      - name: Unit tests (services)
        working-directory: services
        run: npm test

      - name: Configure AWS credentials (OIDC → gha-deploy-dev)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::610935435571:role/gha-deploy-dev
          role-session-name: gha-deploy-dev-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Who am I
        run: aws sts get-caller-identity

      - name: cdk deploy (Dev)
        run: >
          npx cdk deploy brewline-dev-pipeline-check brewline-dev-data brewline-dev-auth brewline-dev-api
          -c env=dev -c commit=${{ github.sha }}
          --require-approval never
          --outputs-file outputs.json

      # 正向驗證：部署出來的值必須等於這個 commit。
      # Positive check: the deployed value must equal this commit.
      - name: Verify deployed commit
        run: |
          deployed=$(jq -r '."brewline-dev-pipeline-check".PipelineCheckCommit' outputs.json)
          echo "deployed=$deployed expected=${{ github.sha }}"
          test "$deployed" = "${{ github.sha }}"
          echo "✅ Dev runs commit $deployed" >> "$GITHUB_STEP_SUMMARY"

      # 以 CDK lookup role（ReadOnlyAccess）查詢實際狀態：驗證步驟不需要、也不該用部署權限。
      # bootstrap 的 lookup role 信任政策不一定允許 sts:TagSession，所以跳過 session tagging。
      # Verify real state as the read-only CDK lookup role; verification needs no deploy rights.
      - name: Assume read-only lookup role for verification
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::610935435571:role/cdk-hnb659fds-lookup-role-610935435571-ap-east-2
          role-session-name: gha-verify-dev-${{ github.run_id }}
          role-chaining: true
          role-skip-session-tagging: true
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify data stack (KMS CMK, PITR, TTL, protections)
        run: |
          # 失敗時也寫入 Job Summary / Write the summary even when checks fail
          set +e
          scripts/verify-data-stack.sh dev outputs.json | tee verify.txt
          rc=${PIPESTATUS[0]}
          { echo "### Data stack (Dev)"; echo '```'; cat verify.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      - name: Verify auth stack (Cognito, pre token trigger, negative tests)
        run: |
          # 失敗時也寫入 Job Summary / Write the summary even when checks fail
          set +e
          scripts/verify-auth-stack.sh dev outputs.json | tee verify-auth.txt
          rc=${PIPESTATUS[0]}
          { echo "### Auth stack (Dev)"; echo '```'; cat verify-auth.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      - name: Verify API stack (routes, scopes, throttling, negative HTTP tests)
        run: |
          # 失敗時也寫入 Job Summary / Write the summary even when checks fail
          set +e
          scripts/verify-api-stack.sh dev outputs.json | tee verify-api.txt
          rc=${PIPESTATUS[0]}
          { echo "### API stack (Dev)"; echo '```'; cat verify-api.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

  deploy-prod:
    name: Deploy Prod
    needs: deploy-dev
    runs-on: ubuntu-latest
    # 部署＋等 GSI ACTIVE（新增 GSI 實測約 8 分鐘，驗證最多等 20 分鐘）/ deploy + GSI backfill wait
    timeout-minutes: 40
    # 進入 production environment：等待 Required reviewer 核准；只允許 main 分支。
    # Enters the production environment: waits for the required reviewer; main branch only.
    environment: production
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash # 明確指定 → GitHub 會加上 -eo pipefail / explicit bash adds -eo pipefail
        working-directory: infra/app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            infra/app/package-lock.json
            services/package-lock.json

      # cdk deploy 會用 esbuild 打包 services/ 的 Lambda / cdk deploy bundles the Lambdas in services/.
      - name: Install (services)
        working-directory: services
        run: npm ci

      - run: npm ci

      - name: Configure AWS credentials (OIDC → gha-deploy-prod)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::062868712468:role/gha-deploy-prod
          role-session-name: gha-deploy-prod-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Who am I
        run: aws sts get-caller-identity

      - name: cdk deploy (Prod)
        run: >
          npx cdk deploy brewline-prod-pipeline-check brewline-prod-data brewline-prod-auth brewline-prod-api
          -c env=prod -c commit=${{ github.sha }}
          --require-approval never
          --outputs-file outputs.json

      - name: Verify deployed commit
        run: |
          deployed=$(jq -r '."brewline-prod-pipeline-check".PipelineCheckCommit' outputs.json)
          echo "deployed=$deployed expected=${{ github.sha }}"
          test "$deployed" = "${{ github.sha }}"
          echo "✅ Prod runs commit $deployed" >> "$GITHUB_STEP_SUMMARY"

      # 以 CDK lookup role（ReadOnlyAccess）查詢實際狀態：驗證步驟不需要、也不該用部署權限。
      # bootstrap 的 lookup role 信任政策不一定允許 sts:TagSession，所以跳過 session tagging。
      # Verify real state as the read-only CDK lookup role; verification needs no deploy rights.
      - name: Assume read-only lookup role for verification
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::062868712468:role/cdk-hnb659fds-lookup-role-062868712468-ap-east-2
          role-session-name: gha-verify-prod-${{ github.run_id }}
          role-chaining: true
          role-skip-session-tagging: true
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify data stack (KMS CMK, PITR, TTL, protections)
        run: |
          # 失敗時也寫入 Job Summary / Write the summary even when checks fail
          set +e
          scripts/verify-data-stack.sh prod outputs.json | tee verify.txt
          rc=${PIPESTATUS[0]}
          { echo "### Data stack (Prod)"; echo '```'; cat verify.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      - name: Verify auth stack (Cognito, pre token trigger, negative tests)
        run: |
          # 失敗時也寫入 Job Summary / Write the summary even when checks fail
          set +e
          scripts/verify-auth-stack.sh prod outputs.json | tee verify-auth.txt
          rc=${PIPESTATUS[0]}
          { echo "### Auth stack (Prod)"; echo '```'; cat verify-auth.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      - name: Verify API stack (routes, scopes, throttling, negative HTTP tests)
        run: |
          # 失敗時也寫入 Job Summary / Write the summary even when checks fail
          set +e
          scripts/verify-api-stack.sh prod outputs.json | tee verify-api.txt
          rc=${PIPESTATUS[0]}
          { echo "### API stack (Prod)"; echo '```'; cat verify-api.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $rc
